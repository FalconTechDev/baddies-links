name: stats
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch
        run: |
          node - <<'JS'
          const fs = require("fs");
          const UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36";
          const old = JSON.parse(fs.readFileSync("stats.json", "utf8"));
          const tg = async (n) => { try { const t = await (await fetch("https://t.me/" + n, { headers: { "user-agent": UA } })).text(); const m = t.match(/tgme_page_extra">([^<]*)</); const v = m && parseInt(m[1].replace(/\D/g, ""), 10); return Number.isFinite(v) ? v : null; } catch { return null; } };
          const tt = async (n) => { try { const t = await (await fetch("https://www.tiktok.com/@" + n, { headers: { "user-agent": UA, "accept-language": "en-US,en;q=0.9" } })).text(); const m = t.match(/"followerCount":(\d+)/); return m ? +m[1] : null; } catch { return null; } };
          (async () => {
            const [tiktok, telegram, shop] = await Promise.all([tt("badiiss67"), tg("Badiiss76"), tg("Badiiess_SHOP")]);
            const out = { tiktok: tiktok ?? old.tiktok, telegram: telegram ?? old.telegram, shop: shop ?? old.shop };
            console.log(JSON.stringify({ fetched: { tiktok, telegram, shop }, out }));
            fs.writeFileSync("stats.json", JSON.stringify(out) + "\n");
          })();
          JS
      - name: commit
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add stats.json
          git diff --cached --quiet || (git commit -m "stats" && git push)
